services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-to-google-sheet:local
    container_name: discord-to-google-sheet
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GOOGLE_OAUTH_CLIENT_FILE: /app/oauth-client.json
      GOOGLE_OAUTH_TOKEN_FILE: /app/google-token.json
    volumes:
      - ./oauth-client.json:/app/oauth-client.json:ro
      - ./google-token.json:/app/google-token.json:ro
    stop_grace_period: 20s
